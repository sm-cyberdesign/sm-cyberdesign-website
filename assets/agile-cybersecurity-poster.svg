<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="t d"><title id="t">Agile cybersecurity: a continuous improvement cycle</title><desc id="d">Prioritize risk, deliver an improvement, verify its effect, then adapt and repeat.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d6fb51"/></marker></defs><rect width="1200" height="1200" fill="#161619"/><rect x="36" y="36" width="1128" height="1128" rx="26" fill="none" stroke="#bbb8c1" stroke-opacity=".3"/><text x="88" y="110" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">SM CYBER DESIGN / SECURITY STRATEGY</text><text x="84" y="225" fill="#efedf1" font-family="Georgia,serif" font-size="78">Agile cybersecurity.</text><path d="M88 260H450" stroke="#db00a1" stroke-width="5"/><text x="88" y="315" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="28">Make every iteration reduce risk.</text><g fill="none" stroke="#d6fb51" stroke-width="3" marker-end="url(#arrow)"><path d="M545 480H650"/><path d="M910 620V725"/><path d="M650 865H545"/><path d="M290 725V620"/></g><rect x="88" y="395" width="450" height="225" rx="18" fill="#222226" stroke="#bbb8c1" stroke-opacity=".3"/><text x="116" y="443" fill="#d6fb51" font-family="monospace" font-size="24">01</text><text x="116" y="505" fill="#efedf1" font-family="Georgia,serif" font-size="44">Prioritize risk</text><text x="116" y="560" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="25">Choose what matters most.</text><rect x="660" y="395" width="450" height="225" rx="18" fill="#222226" stroke="#bbb8c1" stroke-opacity=".3"/><text x="688" y="443" fill="#d6fb51" font-family="monospace" font-size="24">02</text><text x="688" y="505" fill="#efedf1" font-family="Georgia,serif" font-size="44">Deliver</text><text x="688" y="560" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="25">Make one useful improvement.</text><rect x="660" y="735" width="450" height="225" rx="18" fill="#222226" stroke="#bbb8c1" stroke-opacity=".3"/><text x="688" y="783" fill="#d6fb51" font-family="monospace" font-size="24">03</text><text x="688" y="845" fill="#efedf1" font-family="Georgia,serif" font-size="44">Verify</text><text x="688" y="900" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="25">Test that protection works.</text><rect x="88" y="735" width="450" height="225" rx="18" fill="#222226" stroke="#bbb8c1" stroke-opacity=".3"/><text x="116" y="783" fill="#d6fb51" font-family="monospace" font-size="24">04</text><text x="116" y="845" fill="#efedf1" font-family="Georgia,serif" font-size="44">Adapt</text><text x="116" y="900" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="25">Learn. Adjust. Repeat.</text><text x="88" y="1060" fill="#efedf1" font-family="Arial,sans-serif" font-size="27">Small increments. Clear ownership. Evidence of progress.</text><text x="88" y="1115" fill="#bbb8c1" font-family="Arial,sans-serif" font-size="22">Shima Mudakha · smcyberdesign.com</text></svg>